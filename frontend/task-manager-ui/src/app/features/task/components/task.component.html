
<div class="container">

  <h2>Simple Task Manager</h2>

  <!-- Add Task Form -->
  <form [formGroup]="taskForm" (ngSubmit)="addTask()">
    <div class="form-group">
      <label>Task Title *</label>
      <input type="text" formControlName="title" placeholder="Enter task title">
      <div class="error"
           *ngIf="taskForm.get('title')?.touched &&
                  taskForm.get('title')?.hasError('required')">
        Title is required.
      </div>
    </div>
    <div class="form-group">
      <label>Description</label>
      <textarea formControlName="description" placeholder="Enter description"></textarea>
    </div>
    <button type="submit" [disabled]="loading">Add Task</button>
  </form>
  <hr>
  <!-- Task List -->
  <h3>Created Tasks</h3>
  <p *ngIf="loading">Loading tasks...</p>
  <p class="error" *ngIf="errorMessage">{{ errorMessage }}</p>
  <!-- Sorting Controls -->
  <div class="sorting-container" *ngIf="!loading && totalElements > 0">
    <div class="sort-field">
      <label for="sortBy">Sort By:</label>
      <select id="sortBy" [value]="sortBy" (change)="changeSorting($any($event.target).value)">
        <option value="id">ID</option>
        <option value="title">Title</option>
        <option value="createdAt">Created Date</option>
      </select>
    </div>
    <button type="button" class="sort-direction" (click)="changeSorting(sortBy)">
      {{ sortDirection === 'asc' ? 'Ascending ↑' : 'Descending ↓' }}
    </button>
  </div>
  <!-- No Tasks -->
  <div *ngIf="!loading && tasks.length === 0 && !errorMessage">
    No tasks available.
  </div>
  <!-- Existing Task Display -->
  <div *ngIf="!loading && tasks.length > 0">
    <div class="task-card" *ngFor="let task of tasks">
      <h3>{{ task.title }}</h3>
      <p>{{ task.description }}</p>
      <small *ngIf="task.createdAt">Created: {{ task.createdAt | date:'medium' }}</small>
    </div>
  </div>
  <!-- Pagination -->
  <div class="pagination-container" *ngIf="!loading && totalElements > 0">
    <div class="page-info">
      Total Tasks: {{ totalElements }}
    </div>
    <div class="pagination-controls">
      <button type="button" [disabled]="currentPage === 0" (click)="changePage(currentPage - 1)">
        Previous
      </button>
      <button type="button" *ngFor="let page of pages" [class.active]="currentPage === page" (click)="changePage(page)">
        {{ page + 1 }}
      </button>
      <button type="button" [disabled]="currentPage >= totalPages - 1" (click)="changePage(currentPage + 1)">
        Next
      </button>
    </div>

    <div class="page-size">
      <label for="pageSize">Records per page:</label>
      <select id="pageSize" [value]="pageSize" (change)="changePageSize(+$any($event.target).value)">
        <option value="5">5</option>
        <option value="10">10</option>
        <option value="20">20</option>
      </select>
    </div>
  </div>
</div>

<div class="container">

  <h2>Simple Task Manager</h2>

  <!-- Add Task Form -->

  <form [formGroup]="taskForm"
        (ngSubmit)="addTask()">

    <div class="form-group">

      <label>Task Title *</label>

      <input
        type="text"
        formControlName="title"
        placeholder="Enter task title">

      <div class="error"
           *ngIf="taskForm.get('title')?.touched &&
                  taskForm.get('title')?.hasError('required')">

        Title is required.

      </div>

    </div>

    <div class="form-group">

      <label>Description</label>

      <textarea
        formControlName="description"
        placeholder="Enter description">
      </textarea>

    </div>

    <button type="submit">
      Add Task
    </button>

  </form>

  <hr>

  <!-- Task List -->

  <h3>Created Tasks</h3>

  <p *ngIf="loading">Loading tasks...</p>

  <p class="error" *ngIf="errorMessage">
    {{ errorMessage }}
  </p>

  <div *ngIf="!loading && tasks.length === 0">

    No tasks available.

  </div>

  <div *ngFor="let task of tasks" class="task-card">
    <h3>{{ task.title }}</h3>
    <p>{{ task.description }}</p>
    <small>{{ task.createdAt | date:'medium' }}</small>
  </div>

</div>
